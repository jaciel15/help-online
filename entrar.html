<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HELP ONLINE — Entrar</title>
  <link rel="icon" href="assets/img/logo-velocimetros-digitales-cdmx.jpg">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #071018; color: #e8f7ff; padding: 24px;
      background-image:
        radial-gradient(ellipse at top, #0e3a4a 0%, transparent 55%),
        linear-gradient(180deg, #071018, #0a1520);
    }
    .card {
      width: min(440px, 100%);
      border: 1px solid rgba(0, 229, 255, .35);
      border-radius: 18px;
      padding: 28px 22px;
      background: rgba(8, 20, 30, .92);
      box-shadow: 0 0 40px rgba(0, 200, 255, .12);
      text-align: center;
    }
    img.logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #00e5ff; }
    h1 { font-size: 1.25rem; letter-spacing: .06em; margin: 14px 0 8px; }
    p { color: #9ec4d4; line-height: 1.45; margin: 0 0 14px; font-size: .95rem; }
    .status { font-size: .9rem; min-height: 1.4em; margin-bottom: 16px; color: #7fdfff; }
    .status.err { color: #ffb4a8; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; border-radius: 12px; border: 0;
      background: #00e5ff; color: #042028; font-weight: 700; font-size: 1rem;
      text-decoration: none; cursor: pointer;
    }
    .btn.secondary {
      margin-top: 10px; background: transparent; color: #9ec4d4;
      border: 1px solid rgba(158, 196, 212, .45);
    }
    code { color: #c9f7ff; word-break: break-all; font-size: .8rem; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/img/logo-velocimetros-digitales-cdmx.jpg" alt="Velocímetros CDMX">
    <h1>HELP ONLINE</h1>
    <p>Entrando al servidor para subir y editar ayudas…</p>
    <div id="status" class="status">Buscando servidor activo…</div>
    <a id="goBtn" class="btn" href="#" hidden>Abrir administrador</a>
    <button id="retryBtn" class="btn secondary" type="button" hidden>Reintentar</button>
    <p id="hint" hidden style="margin-top:16px;font-size:.82rem">
      Si falla, pide el link actual del servidor.<br>
      <code id="lastUrl"></code>
    </p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("status");
      var goBtn = document.getElementById("goBtn");
      var retryBtn = document.getElementById("retryBtn");
      var hint = document.getElementById("hint");
      var lastUrl = document.getElementById("lastUrl");
      var hash = location.hash || "#administrador";
      if (hash.indexOf("administrador") === -1 && hash.indexOf("admin") === -1) {
        hash = "#administrador";
      }

      function setErr(msg) {
        status.className = "status err";
        status.textContent = msg;
        retryBtn.hidden = false;
        hint.hidden = false;
      }

      function probe(base) {
        if (!base) return Promise.resolve(false);
        base = String(base).replace(/\/$/, "");
        return fetch(base + "/api/health", { cache: "no-store", mode: "cors" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { return !!(j && j.ok); })
          .catch(function () { return false; });
      }

      function go(base) {
        var url = String(base).replace(/\/$/, "") + "/" + hash;
        status.className = "status";
        status.textContent = "Servidor encontrado. Abriendo…";
        goBtn.hidden = false;
        goBtn.href = url;
        lastUrl.textContent = url;
        location.replace(url);
      }

      function run() {
        status.className = "status";
        status.textContent = "Buscando servidor activo…";
        retryBtn.hidden = true;
        goBtn.hidden = true;
        fetch("live.json?ts=" + Date.now(), { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("sin live.json");
            return r.json();
          })
          .then(function (cfg) {
            var urls = [];
            if (cfg && cfg.url) urls.push(cfg.url);
            if (cfg && cfg.backup) urls.push(cfg.backup);
            if (cfg && Array.isArray(cfg.urls)) urls = urls.concat(cfg.urls);
            // unique
            urls = urls.filter(function (u, i, a) { return u && a.indexOf(u) === i; });
            if (!urls.length) throw new Error("sin urls");
            lastUrl.textContent = urls[0];

            var i = 0;
            function next() {
              if (i >= urls.length) {
                setErr("El servidor no está encendido ahora. Avisa para que lo activen y pulsa Reintentar.");
                return;
              }
              var u = urls[i++];
              status.textContent = "Probando " + u.replace(/^https?:\/\//, "") + "…";
              probe(u).then(function (ok) {
                if (ok) go(u);
                else next();
              });
            }
            next();
          })
          .catch(function () {
            setErr("No se encontró el enlace del servidor. Avisa a soporte.");
          });
      }

      retryBtn.addEventListener("click", run);
      run();
    })();
  </script>
</body>
</html>
