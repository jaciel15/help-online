# Deploy permanente en Render.com (URL fija, no se cae como los túneles)
# Pasos: https://dashboard.render.com → New → Blueprint → este repo
services:
  - type: web
    name: help-online
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8765"
      - key: DATA_DIR
        value: "/app/data"
      - key: DATA_SEED
        value: "/app/data-seed"
    disk:
      name: help-data
      mountPath: /app/data
      sizeGB: 1
